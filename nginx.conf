# Kwartel Studio — statische Astro-site achter Coolify/Traefik.
# TLS termineert upstream, dus deze origin luistert alleen op :80.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Lettertypen en assets mogen lang gecachet worden (gehashte bestandsnamen)
    location /_astro/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        expires 1d;
    }

    location = /robots.txt {
        default_type text/plain;
        expires 1d;
    }

    location / {
        # Echte 404's voor ontbrekende pagina's — nooit terugvallen op de homepage
        try_files $uri $uri.html $uri/index.html =404;
        error_page 404 /404.html;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    }
}
